<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>請採驗系統</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <meta name="theme-color" content="#2a7f78">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="請採驗">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <!-- 請採驗獨立入口：與月子中心 ERP 同一套程式與資料庫，只是側欄只留採購作業 -->
  <script>window.APP_ENTRY = 'proc'; window.APP_HOME = '#/proc-dashboard'; window.APP_TITLE = '請採驗系統';</script>
  <script src="/js/pages-procurement.js" defer></script>
</head>
<body>

  <!-- 登入畫面 -->
  <div id="login-view" class="login-wrap" hidden>
    <div class="login-card">
      <h1 id="login-brand">請採驗系統</h1>
      <div class="sub">請購 · 採購 · 驗貨入庫 · 請款</div>
      <form id="login-form">
        <div class="field">
          <label for="login-username">帳號</label>
          <input id="login-username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="login-password">密碼</label>
          <input id="login-password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn" type="submit">登入</button>
        <div class="error-msg" id="login-error"></div>
      </form>
      <div class="login-hint">本入口只提供採購作業；月子中心管理系統請至 <a href="/">主系統入口</a>。</div>
    </div>
  </div>

  <!-- 主畫面 -->
  <div id="app-view" hidden>
    <header class="topbar">
      <button class="menu-btn" id="menu-btn" aria-label="選單">&#9776;</button>
      <div class="brand" id="brand">請採驗系統</div>
      <div class="spacer"></div>
      <div class="user-info" id="user-info"></div>
      <button class="btn small secondary" id="logout-btn" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.6)">登出</button>
    </header>

    <div class="overlay" id="overlay"></div>

    <nav class="sidenav" id="sidenav">
      <div class="nav-section" data-section>請採驗作業</div>
      <a href="#/proc-dashboard" data-nav data-perm="proc_request,proc_account,proc_finance,proc_admin">採購總覽</a>
      <a href="#/proc-requests" data-nav data-perm="proc_request,proc_account,proc_finance,proc_admin">請購單</a>
      <a href="#/proc-orders" data-nav data-perm="proc_buyer,proc_account,proc_finance,proc_admin">採購單</a>
      <a href="#/proc-receiving" data-nav data-perm="proc_receive,proc_account,proc_finance,proc_admin">驗貨入庫</a>
      <a href="#/proc-payments" data-nav data-perm="proc_account,proc_finance,proc_admin">請款單</a>
      <div class="nav-section" data-section>庫存與倉別</div>
      <a href="#/proc-stock" data-nav data-perm="proc_request,proc_buyer,proc_receive,proc_ship,proc_account,proc_finance,proc_admin">庫存總覽</a>
      <a href="#/proc-transfers" data-nav data-perm="proc_ship,proc_receive,proc_buyer,proc_finance,proc_admin">調撥單</a>
      <a href="#/proc-shipments" data-nav data-perm="proc_ship,proc_finance,proc_admin">出貨管理</a>
      <a href="#/proc-picks" data-nav data-perm="proc_ship,proc_account,proc_finance,proc_admin">領料單</a>
      <div class="nav-section" data-section>基本資料</div>
      <a href="#/proc-items" data-nav data-perm="proc_buyer,proc_finance,proc_admin">品項管理</a>
      <a href="#/proc-vendors" data-nav data-perm="proc_buyer,proc_finance,proc_admin">廠商管理</a>
      <a href="#/proc-warehouses" data-nav data-perm="proc_buyer,proc_finance,proc_admin">倉庫管理</a>
      <a href="#/proc-reports" data-nav data-perm="proc_finance,proc_admin">採購報表</a>
      <a href="#/proc-settings" data-nav data-perm="proc_finance,proc_admin">採購設定</a>
    </nav>

    <div class="layout">
      <main class="content" id="main"></main>
    </div>
  </div>

  <dialog class="modal" id="modal">
    <div class="modal-head">
      <h3 id="modal-title"></h3>
      <button class="close-btn" id="modal-close" aria-label="關閉">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </dialog>

  <script src="/js/api.js"></script>
  <script src="/js/help.js"></script>
  <script src="/js/ai-shim.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
